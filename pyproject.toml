[project]
name = "lottobrain"
version = "0.1.0"
description = "LottoBrain: domínio, ingestão e plataforma privada de loterias"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
api = ["fastapi==0.162.0", "uvicorn==0.54.0"]
database = ["alembic==1.20.0", "SQLAlchemy==2.0.55", "psycopg[binary]==3.3.6"]
jobs = [
  {include-group = "database"},
  "openpyxl==3.1.5", "pandas==2.2.3", "numpy==2.5.4", "requests==2.33.0",
]
test = [
  {include-group = "api"}, {include-group = "jobs"},
  "pytest==8.3.5", "httpx2==2.16.0", "PyYAML==6.0.3",
]
quality = ["ruff==0.17.3", "mypy==2.4.1", "pip-audit==2.10.1"]

[tool.uv]
package = false
default-groups = ["test", "quality"]
required-version = "==0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["database", ".git", ".venv*", "node_modules"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local-postgres", "data", "docs", "frontend", ".venv-dev"]

[tool.ruff.lint]
# Gate do legado: erros fatais; código novo também usa o perfil estrito do comando quality.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/interfaces/http", "app/infrastructure/settings.py", "scripts/engineering/check.py"]
explicit_package_bases = true

