name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOTTOBRAIN_ENV: test
  UV_PYTHON_DOWNLOADS: never
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  python:
    name: Python — qualidade, testes e dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, SHA conferido
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Instalar ferramenta fixada e ambiente resolvido
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked
      - name: Qualidade e verificação básica de credenciais
        run: uv run --frozen python scripts/engineering/check.py quality
      - name: Testes offline
        run: uv run --frozen python scripts/engineering/check.py test
      - name: Auditar dependências da API e dos jobs
        run: |
          mkdir -p .local-postgres/ci
          uv export --frozen --no-default-groups --group api --group jobs --no-hashes --no-emit-project --output-file .local-postgres/ci/requirements-audit.txt
          uv run --frozen python -m pip_audit --requirement .local-postgres/ci/requirements-audit.txt --no-deps --disable-pip --strict
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: python-test-results
          path: test-results/python.xml
          if-no-files-found: warn
          retention-days: 7

  postgresql:
    name: PostgreSQL 17 — migrations e integridade
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Preparar dependências de integração
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --no-default-groups --group jobs
      - name: Instalar binários PostgreSQL 17 no runner descartável
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
      - name: Executar suíte real em cluster próprio e desligá-lo ao terminar
        run: uv run --frozen --no-default-groups --group jobs python scripts/database/run_integration.py --pg-bin /usr/lib/postgresql/17/bin

  frontend:
    name: Frontend — tipos, testes, build e dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar npm e dependências resolvidas
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          npm ci --ignore-scripts
      - name: Verificar frontend
        run: npm run check
      - name: Auditar dependências
        run: npm audit --audit-level=high

  quality-gate:
    name: Quality gate
    needs: [python, postgresql, frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PYTHON_RESULT: ${{ needs.python.result }}
      POSTGRESQL_RESULT: ${{ needs.postgresql.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
    steps:
      - name: Exigir sucesso dos três grupos
        run: |
          test "$PYTHON_RESULT" = success
          test "$POSTGRESQL_RESULT" = success
          test "$FRONTEND_RESULT" = success
