  <title></title>

  <body>
  
     <script src="https://www.loteriasyapuestas.es/f/loterias/paginas_libres/Resultados-sorteos/js/jquery.js"></script>
     <script src="https://www.loteriasyapuestas.es/f/loterias/paginas_libres/Resultados-sorteos/js/jquery.jsonp.js"></script>
  
  <script type="text/javascript">
  
  
  $( document ).ready(function() {
  
  
  $.urlParam = function(name){
    var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
    if (results == null){
       return null;
    }
    else {
       return decodeURI(results[1]) || 0;
    }
    }

  
 	var fechaSorteo =   $.urlParam('fecha_sorteo');  //
    var game_id =   $.urlParam('game_id');  //

	iniciarEstadisticas(fechaSorteo,game_id);
    
  function formatoFecha(str) {
    var dateSrt = str.split(' ')[0];
    
     var dateSrtGuiones = dateSrt.split('-');
     
     return dateSrtGuiones[2]+"/"+ dateSrtGuiones[1]+"/"+  dateSrtGuiones[0];

} 

  function iniciarEstadisticas(fechaSorteo,game_id) {

	var urlServicioResultadosCMS = "https://www.loteriasyapuestas.es/servicios/fechav3?game_id="+game_id;
	urlServicioResultadosCMS=urlServicioResultadosCMS+"&fecha_sorteo="+fechaSorteo;
	$.ajax({
		url:urlServicioResultadosCMS,
		cache:true,
	    crossDomain: true,
	    contentType: "application/json",
	   
	    async: false,	   
		beforeSend: function() {

		},

		success: function(salida) {
		
			
			if(typeof salida =='object')
			{

		    	$(".resultado").html(salida[0].combinacion);	
                	$(".Juego").html(game_id);
				$(".fecha_sorteo").html(formatoFecha(salida[0].fecha_sorteo));
               
                $(".millon").html(salida[0].millon.combinacion);
             
			}
		
	    	},
		error: function(jq,status,message) {

			console.log("ddd"+message);

	    }

	});
}



  });
  
  
  </script>

	<div class="contenedor">
    	<div class="flex"></div>
    		<div class="contenido">
	    		<div style="display:none;" class="Juego"></div> 
	  			<img style="text-align: center;" src="https://www.loteriasyapuestas.es/f/loterias/paginas_libres/Resultados-sorteos/img/EUROMILLONES.png">
				<h1>Resultados último sorteo</h1>
        		
				<div class="fecha_sorteo"></div>
				<div class="resultado"></div>
                <img width="180px" style="text-align: center;" src="https://www.loteriasyapuestas.es/f/loterias/paginas_libres/Resultados-sorteos/img/MILLON.png"> <div class="millon"></div>

	</div>

  </body>
